<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>QR Code Generator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <h1>QR Code Generator</h1>
        <div class="content">
            <input type="text" placeholder="Enter your text or link">
            <button>🔃Generate</button>
        </div>

        <div class="alertbox">
            <h4>please enter your text or link, FIRST</h4>
        </div>

        <div class="qrcode">
            <div id="qrBox"></div>
        </div>

        <button class="down">Download</button>


    </div>
    

    <script src="qrcode.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
